tasks:
  - name: "test-pecl-package"
    tags: ["pecl", "nodb", "pr", "tag"]
    commands:
      - command: shell.exec
        type: test
        params:
          working_dir: "src"
          add_expansions_to_env: true
          script: |
            set -o errexit

            PHP_PATH=$(find /opt/php/ -maxdepth 1 -type d -name "8.3*-64bit" -print | sort -V -r | head -n 1)/bin
            export PATH="$PHP_PATH:$PATH"
            echo "PHP: $(php --version | head -n 1)"

            # Build step required to generate the Makefile for `make package`
            phpize
            ./configure --enable-mongodb-developer-flags

            echo "Testing" > changelog
            make package.xml RELEASE_NOTES_FILE=$(pwd)/changelog
            make package

            PACKAGE_VERSION=$(./bin/update-release-version.php get-version)
            PACKAGE_FILE="mongodb-${PACKAGE_VERSION}.tgz"

            # Install via PECL (fresh configure + build in a temp directory, same as a real user install)
            pecl install "$PACKAGE_FILE"
            php --ri mongodb

  - name: "test-atlas-connectivity"
    tags: ["atlas", "nodb", "pr", "tag"]
    commands:
      - command: ec2.assume_role
        params:
          role_arn: ${aws_test_secrets_role}
      # This creates secrets-export.sh, which is later sourced by run-tests.sh
      - command: subprocess.exec
        params:
          working_dir: "src"
          include_expansions_in_env: [AWS_SECRET_ACCESS_KEY, AWS_ACCESS_KEY_ID, AWS_SESSION_TOKEN]
          binary: bash
          args:
            - -c
            - ${DRIVERS_TOOLS}/.evergreen/secrets_handling/setup-secrets.sh drivers/atlas_connect
      - func: "run tests"
        vars:
          TESTS: "tests/atlas.phpt"
