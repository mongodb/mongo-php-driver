name: "Static Analysis"

on:
  merge_group:
  pull_request:
    branches:
      - "v*.*"
      - "feature/*"
  push:
    branches:
      - "v*.*"
      - "feature/*"
  workflow_call:
    inputs:
      ref:
        description: "The git ref to check"
        type: string
        required: true

jobs:
  # Static analysis findings are surfaced via SARIF upload, which requires Code
  # Security (GitHub Advanced Security). Limit to the public repo to avoid
  # failing GitHub Actions on mirrors.
  semgrep:
    name: "Semgrep"
    if: github.repository == 'mongodb/mongo-php-driver'
    runs-on: "ubuntu-latest"
    container:
      image: semgrep/semgrep

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: true

      - name: "Scan"
        run: semgrep scan --sarif-output=semgrep.sarif

      - name: "Upload SARIF report"
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: semgrep.sarif
