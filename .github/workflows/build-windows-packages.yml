name: "Build Windows Packages"
run-name: "Build Windows Packages for ${{ inputs.ref }}"

on:
  workflow_call:
    inputs:
      version:
        description: "The version being built"
        type: string
        required: true
      ref:
        description: "The git reference to build"
        type: string
        required: true
      upload_release_assets:
        description: "Whether to upload assets to a GitHub release"
        type: boolean
        default: false

jobs:
  build:
    name: "Build DLL"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: cmd

    strategy:
      fail-fast: false
      matrix:
        os: [ "windows-2022" ]
        # Note: keep this in sync with the Windows matrix in tests.yml
        php-version:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        ts: [ ts, nts ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          ref: ${{ inputs.ref }}

      - name: "Build Driver"
        id: build-driver
        uses: ./.github/actions/windows/build
        with:
          php-version: ${{ matrix.php-version }}
          ts: ${{ matrix.ts }}
          run-tests: false

  sign-and-upload:
    environment: release
    name: "Sign and create package"
    needs: build
    runs-on: "ubuntu-latest"
    permissions:
      id-token: write

    steps:
      - name: "Generate token and checkout repository"
        uses: mongodb-labs/drivers-github-tools/secure-checkout@99b1cbd729bc83bf7fc74e1b2a97fffad3d65d7b  # v3.1.1
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          ref: ${{ inputs.ref }}

      - name: "Set up drivers-github-tools"
        uses: mongodb-labs/drivers-github-tools/setup@99b1cbd729bc83bf7fc74e1b2a97fffad3d65d7b  # v3.1.1
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region_name: ${{ vars.AWS_REGION_NAME }}
          aws_secret_id: ${{ secrets.AWS_SECRET_ID }}

      - name: Get artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          pattern: php_mongodb-*.zip
          merge-multiple: true

      - name: "Create detached signatures for packages"
        uses: mongodb-labs/drivers-github-tools/gpg-sign@99b1cbd729bc83bf7fc74e1b2a97fffad3d65d7b  # v3.1.1
        with:
          filenames: artifacts/php_mongodb*.zip

      - name: "Move signatures from release assets folder"
        run: |
          mv ${RELEASE_ASSETS}/php_mongodb*.sig artifacts/

      - name: "Upload assets to release"
        if: ${{ inputs.upload_release_assets }}
        run: |
          gh release upload ${{ inputs.version }} artifacts/php_mongodb* --clobber
