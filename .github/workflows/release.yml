name: "Release New Version"
run-name: "Release ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to be released in PECL format (e.g. 1.19.1, 1.20.0beta1)"
        required: true
        type: "string"
      jira-version-number:
        description: "JIRA version ID (e.g. 54321)"
        required: true
        type: "string"

env:
  default-release-message: |
    The PHP team is happy to announce that version {0} of the MongoDB PHP extension is now available.
    - [mongodb/mongodb-extension](https://packagist.org/packages/mongodb/mongodb-extension#{0}) on Packagist.
    - [mongodb](https://pecl.php.net/package/mongodb) on PECL

    **Release Highlights**

    TODO: one or more paragraphs describing important changes in this release

    A complete list of resolved issues in this release may be found in [JIRA](https://jira.mongodb.org/secure/ReleaseNote.jspa?version={1}&projectId=12484).

    **Documentation**

    Documentation is available on [PHP.net](https://www.php.net/mongodb).

    **Installation**

    You can either download and install the source manually, or you can install the extension with:

    ```
    pie install mongodb/mongodb-extension:{0}
    ```

    Sources and Windows binaries are attached to the GitHub release notes.

jobs:
  prepare-release:
    environment: release
    name: "Prepare release"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: "Check version number format"
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+((alpha|beta|RC)[0-9]+)?$ ]]; then
            echo '❌ Version ${{ inputs.version }} does not match expected format' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: "Create release output"
        run: echo '🎬 Release process for version ${{ inputs.version }} started by @${{ github.triggering_actor }}' >> $GITHUB_STEP_SUMMARY

      - name: "Generate token and checkout repository"
        uses: mongodb-labs/drivers-github-tools/secure-checkout@v3
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          # This job only modifies phongo_version.h. Checked-out submodules make
          # the tree look dirty after switching branches for the merge up.
          submodules: false
          fetch-depth: 0

      - name: "Store version numbers in env variables"
        run: |
          echo RELEASE_VERSION=${{ inputs.version }} >> $GITHUB_ENV
          echo RELEASE_VERSION_WITHOUT_STABILITY=$(echo ${{ inputs.version }} | sed 's/\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/') >> $GITHUB_ENV
          echo STABLE_BRANCH=v$(echo ${{ inputs.version }} | cut -d '.' -f-2) >> $GITHUB_ENV
          echo DEV_BRANCH=v$(echo ${{ inputs.version }} | cut -d '.' -f-1).x >> $GITHUB_ENV
          # Default release branch to the triggered branch; may be overridden when a new stable branch is created
          echo RELEASE_BRANCH=${{ github.ref_name }} >> $GITHUB_ENV

      - name: "Ensure release tag does not already exist"
        run: |
          if [[ $(git tag -l ${{ inputs.version }}) == ${{ inputs.version }} ]]; then
            echo '❌ Release failed: tag for version ${{ inputs.version }} already exists' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: "Fail if patch release is created from wrong release branch"
        if: ${{ !endsWith(env.RELEASE_VERSION_WITHOUT_STABILITY, '.0') && env.STABLE_BRANCH != github.ref_name }}
        run: |
          echo '❌ Release failed due to branch mismatch: expected ${{ inputs.version }} to be released from ${{ env.STABLE_BRANCH }}, got ${{ github.ref_name }}' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: "Fail if non-patch release is created from wrong release branch"
        if: ${{ endsWith(env.RELEASE_VERSION_WITHOUT_STABILITY, '.0') && env.STABLE_BRANCH != github.ref_name && env.DEV_BRANCH != github.ref_name }}
        run: |
          echo '❌ Release failed due to branch mismatch: expected ${{ inputs.version }} to be released from ${{ env.STABLE_BRANCH }} or ${{ env.DEV_BRANCH }}, got ${{ github.ref_name }}' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: "Set up drivers-github-tools"
        uses: mongodb-labs/drivers-github-tools/setup@v3
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region_name: ${{ vars.AWS_REGION_NAME }}
          aws_secret_id: ${{ secrets.AWS_SECRET_ID }}

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"

      - name: "Create and push new release branch for non-patch release"
        if: ${{ endsWith(env.RELEASE_VERSION_WITHOUT_STABILITY, '.0') && env.DEV_BRANCH == github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads origin ${STABLE_BRANCH}; then
            echo "::error::Release branch ${STABLE_BRANCH} already exists on remote. Aborting to prevent overwriting existing work."
            exit 1
          fi
          echo '🆕 Creating new release branch ${{ env.STABLE_BRANCH }} from ${{ github.ref_name }}' >> $GITHUB_STEP_SUMMARY
          git checkout -b ${STABLE_BRANCH}
          git push origin ${STABLE_BRANCH}
          echo RELEASE_BRANCH=${STABLE_BRANCH} >> $GITHUB_ENV

      - name: "Bump default branch to next minor development version"
        if: ${{ endsWith(env.RELEASE_VERSION_WITHOUT_STABILITY, '.0') && env.DEV_BRANCH == github.ref_name }}
        run: |
          git checkout ${DEV_BRANCH}
          ./bin/update-release-version.php to-next-minor-dev
          git add phongo_version.h
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump version to $(./bin/update-release-version.php get-version)"
          git push origin ${DEV_BRANCH}
          git checkout ${RELEASE_BRANCH}

      - name: "Create package commit"
        uses: mongodb-labs/drivers-github-tools/bump-version@v3
        with:
          version: ${{ inputs.version }}
          # Note: this script will fail and abort if the requested version can't be released
          version_bump_script: "./bin/update-release-version.php release"
          commit_template: 'Package ${VERSION}'
          # Don't push changes as we're creating a second commit later
          push_commit: false

      - name: "Create release tag"
        uses: mongodb-labs/drivers-github-tools/tag-version@v3
        with:
          version: ${{ inputs.version }}
          tag_message_template: 'Release ${VERSION}'
          # Don't push tag, we'll do that after merging up
          push_tag: false

      - name: "Bump to next development release and commit"
        uses: mongodb-labs/drivers-github-tools/bump-version@v3
        with:
          version: ${{ inputs.version }}
          version_bump_script: "./bin/update-release-version.php to-next-dev"
          commit_template: 'Back to -dev'
          # Don't push commit, we still need to merge up
          push_commit: false

      # The garasign container used by bump-version and tag-version runs as root
      # and leaves root-owned objects in .git, which later steps cannot write to
      - name: "Restore repository ownership"
        run: sudo chown -R "$(id -u):$(id -g)" .git

      - name: "Determine branch to merge up to"
        id: get-next-branch
        uses: alcaeus/automatic-merge-up-action/get-next-branch@1.0.1
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          branchNamePattern: 'v<major>.<minor>'
          devBranchNamePattern: 'v<major>.x'
          ignoredBranches: ${{ vars.IGNORED_MERGE_UP_BRANCHES }}

      - name: "Manually merge up changes"
        if: ${{ steps.get-next-branch.outputs.hasNextBranch }}
        run: |
          git checkout ${NEXT_BRANCH}
          git merge --strategy=ours ${RELEASE_BRANCH}
          git push origin ${NEXT_BRANCH}
          git checkout ${RELEASE_BRANCH}
        env:
          NEXT_BRANCH: ${{ steps.get-next-branch.outputs.branchName }}

      - name: "Push tag and release branch"
        run: |
          git push origin ${RELEASE_BRANCH}
          git push origin tag ${{ inputs.version }}

      - name: "Prepare release message"
        run: |
          cat > release-message <<'EOL'
          ${{ format(env.default-release-message, inputs.version, inputs.jira-version-number) }}
          EOL

      - name: "Create draft release"
        run: |
          if [[ "${{ inputs.version }}" =~ (alpha|beta|RC) ]]; then
            PRERELEASE="--prerelease --latest=false"
          fi
          echo "RELEASE_URL=$(gh release create ${{ inputs.version }} ${PRERELEASE} --target ${{ env.RELEASE_BRANCH }} --title "${{ inputs.version }}" --notes-file release-message --draft)" >> "$GITHUB_ENV"

      - name: "Set summary"
        run: |
          echo '🚀 Created tag and drafted release for version [${{ inputs.version }}](${{ env.RELEASE_URL }})' >> $GITHUB_STEP_SUMMARY
          echo '✍️ You may now update the release notes and publish the release when ready' >> $GITHUB_STEP_SUMMARY
          echo '🏷️ Once published, mark the [JIRA version](https://jira.mongodb.org/projects/PHPC/versions/${{ inputs.jira-version-number }}) as released' >> $GITHUB_STEP_SUMMARY
