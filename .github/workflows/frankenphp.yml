name: "FrankenPHP"

on:
  pull_request:
    branches:
      - "v*.*"
      - "feature/*"
  push:
    branches:
      - "v*.*"
      - "feature/*"

jobs:
  thread-reboot:
    name: "FrankenPHP in-process thread reboot"
    runs-on: "ubuntu-24.04"

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: "Run the restart test"
        run: "bash tests/frankenphp/restart-test.sh"
