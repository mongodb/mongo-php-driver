name: "Build DLL files for Windows"
description: "Prepares the PHP build environment for the MongoDB driver"
inputs:
  php-version:
    description: "PHP version to build for"
    required: true
  arch:
    description: "The architecture to build for (x64 or x86)"
    required: true
  ts:
    description: "Thread-safety (nts or ts)"
    required: true
  run-tests:
    description: "Whether to run tests after building"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Build extension
      # Temporary fork of php/php-windows-builder 1.9.0 (29352c0) with a fix for
      # downloads.php.net returning 403 for directory listings: fall back to the
      # series manifests for dependency detection.
      # Refer: https://github.com/php/php-windows-builder/issues/34
      # Revert to the upstream action once a release includes a fix.
      uses: kevinAlbs/php-windows-builder/extension@8a1eec4a4dffc6a30a7ea86afa3a5c2bc5ac90e4  # fix-deps-listing-403
      with:
        php-version: ${{ inputs.php-version }}
        arch: ${{ inputs.arch }}
        ts: ${{ inputs.ts }}
        run-tests: ${{ inputs.run-tests == 'true' && true || false }}
        test-runner-args: "--show-diff"
        args: "--enable-mongodb --with-mongodb-sasl=yes --with-mongodb-client-side-encryption=yes"
        libs: "openssl"
        test-workers: 1
