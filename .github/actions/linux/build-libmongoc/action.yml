name: "Build libmongoc"
description: "Builds and installs libmongoc"
inputs:
  prefix:
    description: "Prefix to install libmongoc to"
    default: "/usr/local"
  version:
    description: "Libmongoc version to build (major.minor.patch)"
    required: true
runs:
  using: composite

  steps:
    - name: Download libmongoc
      shell: bash
      working-directory: /tmp
      run: wget "https://github.com/mongodb/mongo-c-driver/archive/refs/tags/${LIBMONGOC_VERSION}.tar.gz" --output-document="mongo-c-driver.tar.gz"
      env:
        LIBMONGOC_VERSION: ${{ inputs.version }}

    - name: Extract libmongoc
      shell: bash
      working-directory: /tmp
      run: tar xf "mongo-c-driver.tar.gz"

    - name: Configure cmake
      shell: bash
      working-directory: /tmp
      run: |
        cmake \
          -S "mongo-c-driver-${LIBMONGOC_VERSION}" \
          -B _build \
          -D CMAKE_BUILD_TYPE=RelWithDebInfo \
          -D BUILD_VERSION="${LIBMONGOC_VERSION}" \
          -D ENABLE_MONGOC=ON \
          -D ENABLE_CLIENT_SIDE_ENCRYPTION=ON
        # Note: ENABLE_TRACING is deliberately left off. libmongoc 1.x writes its
        # trace output to stdout, and this branch has no log handler to capture
        # it, so the traces would break the expected output of every test.
      env:
        LIBMONGOC_VERSION: ${{ inputs.version }}

    - name: Build libmongoc
      shell: bash
      working-directory: /tmp
      run: cmake --build _build --config RelWithDebInfo --parallel

    - name: Install libmongoc
      shell: bash
      working-directory: /tmp
      run: sudo cmake --install _build --prefix "${PREFIX}" --config RelWithDebInfo
      env:
        PREFIX: ${{ inputs.prefix }}

    # Note: libmongoc 1.x installs its pkg-config file as libmongoc-1.0.pc,
    # whereas libmongoc 2.x uses mongoc2.pc.
    - name: Check pkg-config availability
      shell: bash
      run: pkg-config --modversion libmongoc-1.0
